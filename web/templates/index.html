<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>chess-pick</title>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
  <link rel="stylesheet" href="/static/style.css?v=36" />
</head>
<body>
  <header>
    <h1>Chess-Pick</h1>
    <blockquote class="subtitle">„pro filtrování zajímavých pozic"</blockquote>
    <div class="author">IM Jáchym Němec</div>
    <button id="theme-toggle" class="theme-toggle" title="Přepnout dark / light mode">🌓</button>
  </header>

  <main class="three-col" id="main-grid">

    <!-- LEFT: chessboard + nav + FEN + output -->
    <section class="col left">
      <div id="board" class="board"></div>
      <div class="board-nav">
        <button id="nav-start" title="Začátek partie">⏮</button>
        <button id="nav-back" title="Tah zpět">◀</button>
        <button id="nav-forward" title="Tah vpřed">▶</button>
        <button id="nav-end" title="Konec partie">⏭</button>
      </div>
      <div class="move-info">
        <span id="last-move">—</span>
      </div>
      <div class="fen-display">
        <label>FEN:</label>
        <input type="text" id="fen" readonly />
        <a id="open-in-lichess" target="_blank" rel="noopener"
           title="Otevřít aktuální pozici v Lichess analýze (engine + database)">↗ Lichess</a>
      </div>
      <div class="output">
        <div class="output-header">
          <strong>Výsledek analýzy</strong>
          <button id="btn-export-pdf" title="Stáhnout pozice jako PDF (A4, 6 diagramů na stránku + řešení)" disabled>📄 PDF</button>
          <button id="btn-copy-output" title="Zkopírovat výstup">📋</button>
          <button id="btn-download-output" title="Stáhnout výstup">⬇</button>
        </div>
        <div id="output-area">Žádná analýza zatím nespuštěna.</div>
      </div>
    </section>

    <div class="resizer" data-resizer="left"></div>

    <!-- MIDDLE: PGN browser -->
    <section class="col middle">
      <div class="pgn-upload">
        <label class="upload-label">
          Upload PGN
          <input type="file" id="upload-input" accept=".pgn" />
        </label>
      </div>
      <div class="panel">
        <div class="panel-title">PGN soubory</div>
        <ul id="pgn-list" class="scroll-list"></ul>
      </div>
      <div class="panel">
        <div class="panel-title">Partie v <span id="selected-pgn">(nic vybráno)</span></div>
        <ul id="games-list" class="scroll-list"></ul>
      </div>
      <div class="panel game-detail">
        <div class="panel-title">Detail partie</div>
        <div id="game-detail-area">
          <em>Vyber partii dvojklikem nahoře.</em>
        </div>
      </div>
    </section>

    <div class="resizer" data-resizer="middle"></div>

    <!-- RIGHT: rule + params + analyze -->
    <section class="col right">
      <div class="panel">
        <div class="panel-title">Pravidlo</div>
        <select id="rule-select">
          <option value="blunder" selected>Rule 1 — Blunder</option>
          <option value="zwischenzug">Rule 2 — Zwischenzug</option>
          <option value="pawn_structure">Rule 3 — Struktura / rozestavění</option>
          <option value="mate">Rule 4 — Mat (mate in N)</option>
        </select>
        <p id="rule-description" class="rule-description"></p>
      </div>

      <div class="panel">
        <div class="panel-title">Parametry</div>
        <div id="rule-params"></div>
      </div>

      <div class="pieces-art" aria-hidden="true">
        <!-- shared SVG defs -->
        <svg width="0" height="0" style="position:absolute" aria-hidden="true">
          <defs>
            <linearGradient id="piece-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7ab5ff"/>
              <stop offset="55%" stop-color="#4a90e2"/>
              <stop offset="100%" stop-color="#1f4e8c"/>
            </linearGradient>
            <radialGradient id="piece-glow" cx="50%" cy="50%" r="55%">
              <stop offset="0%" stop-color="#4a90e2" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#4a90e2" stop-opacity="0"/>
            </radialGradient>
          </defs>
        </svg>

        <div class="chess-arena">

        <div class="piece-cell" data-piece="king" title="Klikni">
          <div class="piece-bubble"></div>
          <svg viewBox="0 0 45 45">
            <circle cx="22.5" cy="24" r="22" fill="url(#piece-glow)"/>
            <g fill="url(#piece-gradient)" stroke="url(#piece-gradient)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M 22.5,11.63 L 22.5,6" fill="none"/>
              <path d="M 20,8 L 25,8" fill="none"/>
              <path d="M 22.5,25 C 22.5,25 27,17.5 25.5,14.5 C 25.5,14.5 24.5,12 22.5,12 C 20.5,12 19.5,14.5 19.5,14.5 C 18,17.5 22.5,25 22.5,25"/>
              <path d="M 12.5,37 C 18,40.5 27,40.5 32.5,37 L 32.5,30 C 32.5,30 41.5,25.5 38.5,19.5 C 34.5,13 25,16 22.5,23.5 L 22.5,27 L 22.5,23.5 C 20,16 10.5,13 6.5,19.5 C 3.5,25.5 12.5,30 12.5,30 z"/>
            </g>
          </svg>
        </div>

        <div class="piece-cell" data-piece="queen" title="Klikni">
          <div class="piece-bubble"></div>
          <svg viewBox="0 0 45 45">
            <circle cx="22.5" cy="24" r="22" fill="url(#piece-glow)"/>
            <g fill="url(#piece-gradient)" stroke="url(#piece-gradient)" stroke-width="1.2" stroke-linejoin="round">
              <path d="M 9,26 C 17.5,24.5 30,24.5 36,26 L 38.5,13.5 L 31,25 L 30.7,10.9 L 25.5,24.5 L 22.5,10 L 19.5,24.5 L 14.3,10.9 L 14,25 L 6.5,13.5 L 9,26 z"/>
              <path d="M 9,26 C 9,28 10.5,28 11.5,30 C 12.5,31.5 12.5,31 12,33.5 C 10.5,34.5 11,36 11,36 C 9.5,37.5 11,38.5 11,38.5 C 17.5,39.5 27.5,39.5 34,38.5 C 34,38.5 35.5,37.5 34,36 C 34,36 34.5,34.5 33,33.5 C 32.5,31 32.5,31.5 33.5,30 C 34.5,28 36,28 36,26 C 27.5,24.5 17.5,24.5 9,26 z"/>
              <circle cx="6" cy="12" r="2"/>
              <circle cx="14" cy="9" r="2"/>
              <circle cx="22.5" cy="8" r="2"/>
              <circle cx="31" cy="9" r="2"/>
              <circle cx="39" cy="12" r="2"/>
            </g>
          </svg>
        </div>

        <div class="piece-cell" data-piece="rook" title="Klikni">
          <div class="piece-bubble"></div>
          <svg viewBox="0 0 45 45">
            <circle cx="22.5" cy="24" r="22" fill="url(#piece-glow)"/>
            <g fill="url(#piece-gradient)" stroke="url(#piece-gradient)" stroke-width="1.2" stroke-linejoin="round">
              <path d="M 9,39 L 36,39 L 36,36 L 9,36 z"/>
              <path d="M 12.5,32 L 14,29.5 L 31,29.5 L 32.5,32 z"/>
              <path d="M 12,36 L 12,32 L 33,32 L 33,36 z"/>
              <path d="M 14,29.5 L 14,16.5 L 31,16.5 L 31,29.5 z"/>
              <path d="M 14,16.5 L 11,14 L 34,14 L 31,16.5 z"/>
              <path d="M 11,14 L 11,9 L 15,9 L 15,11 L 20,11 L 20,9 L 25,9 L 25,11 L 30,11 L 30,9 L 34,9 L 34,14 z"/>
            </g>
          </svg>
        </div>

        <div class="piece-cell" data-piece="bishop" title="Klikni">
          <div class="piece-bubble"></div>
          <svg viewBox="0 0 45 45">
            <circle cx="22.5" cy="24" r="22" fill="url(#piece-glow)"/>
            <g fill="url(#piece-gradient)" stroke="url(#piece-gradient)" stroke-width="1.2" stroke-linejoin="round">
              <path d="M 9,36 C 12.39,35.03 19.11,36.43 22.5,34 C 25.89,36.43 32.61,35.03 36,36 C 36,36 37.65,36.54 39,38 C 38.32,38.97 37.35,38.99 36,38.5 C 32.61,37.53 25.89,38.96 22.5,37.5 C 19.11,38.96 12.39,37.53 9,38.5 C 7.65,38.99 6.68,38.97 6,38 C 7.35,36.54 9,36 9,36 z"/>
              <path d="M 15,32 C 17.5,34.5 27.5,34.5 30,32 C 30.5,30.5 30,30 30,30 C 30,27.5 27.5,26 27.5,26 C 33,24.5 33.5,14.5 22.5,10.5 C 11.5,14.5 12,24.5 17.5,26 C 17.5,26 15,27.5 15,30 C 15,30 14.5,30.5 15,32 z"/>
              <circle cx="22.5" cy="8" r="2.5"/>
            </g>
          </svg>
        </div>

        <div class="piece-cell" data-piece="knight" title="Klikni">
          <div class="piece-bubble"></div>
          <svg viewBox="-2 -2 48 50">
            <circle cx="22" cy="22" r="22" fill="url(#piece-glow)"/>
            <g fill="url(#piece-gradient)">
              <path d="M 22,10 C 32.5,11 38.5,18 38,39 L 15,39 C 15,30 25,32.5 23,18 z"/>
              <path d="M 24,18 C 24.38,20.91 18.45,25.37 16,27 C 13,29 13.18,31.34 11,31 C 9.958,30.06 12.41,27.96 11,28 C 10,28 11.19,29.23 10,30 C 9,30 5.997,31 6,26 C 6,24 12,14 12,14 C 12,14 13.89,12.1 14,10.5 C 13.27,9.506 13.5,8.5 13.5,7.5 C 14.5,5.5 16.5,4 16.5,4 C 18,3 18,2.85 18,2 C 18.85,1.5 19.79,1.5 20.5,1.5 C 21,1.5 22,2 22,2 C 22,2 21.85,2 22,4 C 21.85,4 22,5.85 22,6 C 22.85,8 23.85,9 24.5,11 C 24.85,12 24.85,13 24.85,13 L 24,18 z"/>
            </g>
            <circle cx="9" cy="25.5" r="0.9" fill="#0a1a2a"/>
            <ellipse cx="14" cy="15.5" rx="0.55" ry="1.7" fill="#0a1a2a" transform="rotate(30 14 15.5)"/>
          </svg>
        </div>

        <div class="piece-cell" data-piece="pawn" title="Klikni — je mu zima">
          <div class="piece-bubble"></div>
          <svg viewBox="0 0 45 45">
            <circle cx="22.5" cy="24" r="22" fill="url(#piece-glow)"/>
            <path fill="url(#piece-gradient)" stroke="url(#piece-gradient)" stroke-width="1.2" stroke-linejoin="round"
              d="M 22.5,9 C 20.29,9 18.5,10.79 18.5,13 C 18.5,13.89 18.79,14.71 19.28,15.38 C 17.33,16.5 16,18.59 16,21 C 16,23.03 16.94,24.84 18.41,26.03 C 15.41,27.09 11,31.58 11,39.5 L 34,39.5 C 34,31.58 29.59,27.09 26.59,26.03 C 28.06,24.84 29,23.03 29,21 C 29,18.59 27.67,16.5 25.72,15.38 C 26.21,14.71 26.5,13.89 26.5,13 C 26.5,10.79 24.71,9 22.5,9 z"/>
          </svg>
        </div>

        </div>
      </div>

      <div class="analyze-section">
        <button id="btn-analyze">▶ Analyze</button>
        <button id="btn-stop" disabled>■ Stop</button>
        <span id="analyze-status"></span>
      </div>
    </section>

  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="/static/app.js?v=36"></script>
</body>
</html>
